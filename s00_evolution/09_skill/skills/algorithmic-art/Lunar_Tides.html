<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Tides — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers -->
            <h1>Lunar Tides</h1>
            <div class="subtitle">Gravitational resonance rendered through particle trails — distant forces made visible by their effects on matter.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <!-- Particle Count -->
                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="2000" max="20000" step="1000" value="9000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">9000</span>
                    </div>
                </div>

                <!-- Gravitational Wells -->
                <div class="control-group">
                    <label>Gravitational Wells</label>
                    <div class="slider-container">
                        <input type="range" id="wellCount" min="1" max="6" step="1" value="2" oninput="updateParam('wellCount', this.value)">
                        <span class="value-display" id="wellCount-value">2</span>
                    </div>
                </div>

                <!-- Orbital Eccentricity -->
                <div class="control-group">
                    <label>Orbital Eccentricity</label>
                    <div class="slider-container">
                        <input type="range" id="eccentricity" min="0.0" max="1.0" step="0.05" value="0.35" oninput="updateParam('eccentricity', this.value)">
                        <span class="value-display" id="eccentricity-value">0.35</span>
                    </div>
                </div>

                <!-- Pull Strength -->
                <div class="control-group">
                    <label>Pull Strength</label>
                    <div class="slider-container">
                        <input type="range" id="pullStrength" min="0.5" max="3.0" step="0.1" value="1.6" oninput="updateParam('pullStrength', this.value)">
                        <span class="value-display" id="pullStrength-value">1.6</span>
                    </div>
                </div>

                <!-- Trail Length -->
                <div class="control-group">
                    <label>Trail Length</label>
                    <div class="slider-container">
                        <input type="range" id="trailLength" min="2" max="30" step="1" value="14" oninput="updateParam('trailLength', this.value)">
                        <span class="value-display" id="trailLength-value">14</span>
                    </div>
                </div>

                <!-- Phase Drift -->
                <div class="control-group">
                    <label>Phase Drift</label>
                    <div class="slider-container">
                        <input type="range" id="phaseDrift" min="0.0" max="0.02" step="0.001" value="0.006" oninput="updateParam('phaseDrift', this.value)">
                        <span class="value-display" id="phaseDrift-value">0.006</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Core Glow</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#d97757</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Stream Tint</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#6a9bcc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Filament Shade</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#788c5d" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#788c5d</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // LUNAR TIDES — GENERATIVE ART PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            particleCount: 9000,
            wellCount: 2,
            eccentricity: 0.35,
            pullStrength: 1.6,
            trailLength: 14,
            phaseDrift: 0.006,
            colorPalette: ['#d97757', '#6a9bcc', '#788c5d']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS GENERATIVE ART ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let particles = [];
        let wells = [];
        let bgColor;

        // Precomputed color components for performance
        let coreCol, streamCol, filamentCol;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);

            bgColor = color(250, 249, 245);

            initializeSystem();

            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            // Parse colors once
            coreCol = hexToRgb(params.colorPalette[0]);
            streamCol = hexToRgb(params.colorPalette[1]);
            filamentCol = hexToRgb(params.colorPalette[2]);

            // Build gravitational wells — the unseen forces
            wells = [];
            for (let i = 0; i < params.wellCount; i++) {
                wells.push(new GravWell(i));
            }

            // Spawn particles at the periphery
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }

            // Clear canvas
            background(bgColor);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // GRAVITATIONAL WELL — an unseen orbital influence
        // ═══════════════════════════════════════════════════════════════════════

        class GravWell {
            constructor(index) {
                // Position on a ring around center, seeded
                let angle = random(TWO_PI);
                let radius = random(0.15, 0.4) * width;
                this.x = width / 2 + cos(angle) * radius;
                this.y = height / 2 + sin(angle) * radius;

                // Orbital parameters
                this.orbitRadius = random(0.1, 0.3) * width;
                this.orbitSpeed = random(0.0004, 0.0012) * (random() > 0.5 ? 1 : -1);
                this.phase = random(TWO_PI);
                this.eccentricity = params.eccentricity;
                this.strength = random(0.8, 1.2) * params.pullStrength;
                this.index = index;
            }

            // The well itself drifts along an eccentric orbit over time
            update() {
                this.phase += params.phaseDrift;
                let a = this.phase;
                // Eccentric orbit: x stretches, y compresses
                let ex = this.orbitRadius * (1 + this.eccentricity) * cos(a);
                let ey = this.orbitRadius * (1 - this.eccentricity) * sin(a);
                this.x = width / 2 + ex;
                this.y = height / 2 + ey;
            }

            // Force exerted on a particle at (px, py)
            forceOn(px, py) {
                let dx = this.x - px;
                let dy = this.y - py;
                let distSq = dx * dx + dy * dy + 1;
                let dist = sqrt(distSq);
                // Inverse-square-ish attraction, softened near center
                let mag = this.strength * 4000 / distSq;
                // Cap to avoid explosion
                if (mag > 0.6) mag = 0.6;
                return createVector(dx / dist * mag, dy / dist * mag);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PARTICLE — a droplet of matter responding to unseen forces
        // ═══════════════════════════════════════════════════════════════════════

        class Particle {
            constructor() {
                // Born at the periphery
                let angle = random(TWO_PI);
                let radius = random(0.48, 0.5) * width;
                this.x = width / 2 + cos(angle) * radius;
                this.y = height / 2 + sin(angle) * radius;
                this.vx = 0;
                this.vy = 0;
                this.history = [];
                this.maxHistory = params.trailLength;
                // Each particle has a subtle noise offset for organic variation
                this.noiseOffset = random(1000);
            }

            update() {
                // Accumulate forces from all wells
                let ax = 0, ay = 0;
                for (let w of wells) {
                    let f = w.forceOn(this.x, this.y);
                    ax += f.x;
                    ay += f.y;
                }

                // Add a tiny noise perturbation so streams aren't perfectly rigid
                let n = noise(this.x * 0.002, this.y * 0.002, this.noiseOffset) - 0.5;
                ax += n * 0.02;
                ay += n * 0.02;

                // Integrate velocity and position
                this.vx += ax;
                this.vy += ay;
                // Damping keeps particles from spiraling infinitely
                this.vx *= 0.985;
                this.vy *= 0.985;
                this.x += this.vx;
                this.y += this.vy;

                // Record history
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }

                // If a particle escapes or collapses into a well, respawn at periphery
                if (this.x < -20 || this.x > width + 20 || this.y < -20 || this.y > height + 20) {
                    this.respawn();
                }
            }

            respawn() {
                let angle = random(TWO_PI);
                let radius = random(0.48, 0.5) * width;
                this.x = width / 2 + cos(angle) * radius;
                this.y = height / 2 + sin(angle) * radius;
                this.vx = 0;
                this.vy = 0;
                this.history = [];
            }

            display() {
                // Draw the trail with color based on distance to nearest well
                let n = this.history.length;
                if (n < 2) return;

                // Determine color by proximity to nearest well (density of pull)
                let minDist = Infinity;
                for (let w of wells) {
                    let d = dist(this.x, this.y, w.x, w.y);
                    if (d < minDist) minDist = d;
                }
                let t = constrain(map(minDist, 0, width * 0.5, 0, 1), 0, 1);

                // Blend between core glow (near) and filament shade (far)
                let r = lerp(coreCol.r, filamentCol.r, t);
                let g = lerp(coreCol.g, filamentCol.g, t);
                let b = lerp(coreCol.b, filamentCol.b, t);

                // Stream tint modulates the mid-range
                let mid = 1 - abs(t - 0.5) * 2;
                r = lerp(r, streamCol.r, mid * 0.4);
                g = lerp(g, streamCol.g, mid * 0.4);
                b = lerp(b, streamCol.b, mid * 0.4);

                stroke(r, g, b, 60);
                strokeWeight(1);
                noFill();

                beginShape();
                for (let i = 0; i < n; i++) {
                    vertex(this.history[i].x, this.history[i].y);
                }
                endShape();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // DRAW LOOP
        // ═══════════════════════════════════════════════════════════════════════

        function draw() {
            // Fade the background slightly each frame for trailing accumulation
            background(250, 249, 245, 18);

            // Update wells (they drift along their orbits)
            for (let w of wells) {
                w.update();
            }

            // Update and draw particles
            for (let p of particles) {
                p.update();
                p.display();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UTILITY FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 217, g: 119, b: 87 };
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;

            // Some params need full regeneration
            if (paramName === 'particleCount' || paramName === 'wellCount' ||
                paramName === 'eccentricity' || paramName === 'pullStrength') {
                initializeSystem();
            }
            // trailLength updates live on existing particles
            if (paramName === 'trailLength') {
                for (let p of particles) {
                    p.maxHistory = params.trailLength;
                }
            }
        }

        function updateColor(colorId, value) {
            let idx = colorId === 'color1' ? 0 : (colorId === 'color2' ? 1 : 2);
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
            // Re-parse colors
            coreCol = hexToRgb(params.colorPalette[0]);
            streamCol = hexToRgb(params.colorPalette[1]);
            filamentCol = hexToRgb(params.colorPalette[2]);
        }

        function downloadPNG() {
            saveCanvas('lunar-tides-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            // Update UI elements
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('wellCount').value = params.wellCount;
            document.getElementById('wellCount-value').textContent = params.wellCount;
            document.getElementById('eccentricity').value = params.eccentricity;
            document.getElementById('eccentricity-value').textContent = params.eccentricity;
            document.getElementById('pullStrength').value = params.pullStrength;
            document.getElementById('pullStrength-value').textContent = params.pullStrength;
            document.getElementById('trailLength').value = params.trailLength;
            document.getElementById('trailLength-value').textContent = params.trailLength;
            document.getElementById('phaseDrift').value = params.phaseDrift;
            document.getElementById('phaseDrift-value').textContent = params.phaseDrift;

            // Reset colors
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
